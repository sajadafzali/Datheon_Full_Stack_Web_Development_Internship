<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TaskFlow — Task Manager &amp; Productivity Tracker</title>
  <meta name="description" content="A task manager with categories, due dates, filters, drag-and-drop reordering and localStorage persistence." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%234f46e5'/><path d='M28 52l16 16 28-32' fill='none' stroke='white' stroke-width='12' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="app">
    <!-- ============ HEADER + PROGRESS ============ -->
    <header class="top">
      <div>
        <h1>TaskFlow</h1>
        <p class="date-line" id="today"></p>
      </div>
      <div class="progress-wrap">
        <div class="progress-text"><span id="progress-text">0 of 0 done</span><strong id="progress-pct">0%</strong></div>
        <div class="progress" role="progressbar" aria-label="Completed tasks" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="progress">
          <div class="bar" id="bar"></div>
        </div>
      </div>
    </header>

    <!-- ============ ADD TASK ============ -->
    <form id="add-form" class="add-form" novalidate>
      <label class="sr-only" for="title">Task title</label>
      <input id="title" class="grow" type="text" placeholder="What needs to be done?" maxlength="120" autocomplete="off" />
      <label class="sr-only" for="category">Category</label>
      <select id="category"></select>
      <label class="sr-only" for="due">Due date</label>
      <input id="due" type="date" />
      <button type="submit" class="btn primary">Add task</button>
    </form>
    <p id="error" class="error" role="alert"></p>

    <!-- ============ FILTERS ============ -->
    <section class="toolbar" aria-label="Filters">
      <div class="tabs" id="tabs" role="group" aria-label="Filter by status">
        <button class="tab active" data-status="all" aria-pressed="true">All <span class="count" id="n-all">0</span></button>
        <button class="tab" data-status="active" aria-pressed="false">Active <span class="count" id="n-active">0</span></button>
        <button class="tab" data-status="completed" aria-pressed="false">Completed <span class="count" id="n-completed">0</span></button>
      </div>
      <div class="filters-right">
        <label class="sr-only" for="cat-filter">Filter by category</label>
        <select id="cat-filter"></select>
        <label class="sr-only" for="search">Search tasks</label>
        <input id="search" type="search" placeholder="Search…" />
      </div>
    </section>

    <!-- ============ TASK LIST ============ -->
    <ul id="list" class="list" aria-label="Tasks"></ul>
    <div id="empty" class="empty" hidden></div>
    <p id="live" class="sr-only" role="status" aria-live="polite"></p>

    <footer class="foot">
      <span id="left">0 tasks left</span>
      <span id="overdue-note" class="overdue-note" hidden></span>
      <button id="clear-completed" class="btn ghost sm" type="button">Clear completed</button>
    </footer>
    <p class="hint">Tip: drag the ⋮⋮ handle to reorder · press ↑ / ↓ on the handle · double-click a title to edit · data is saved in your browser.</p>
  </main>

  <script src="js/tasks.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
